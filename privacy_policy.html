<!DOCTYPE html>
<html lang="ko"><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"><head><title></title><meta http_quiv="content-type" content="text/html; charset=utf-8"><link rel="stylesheet" type="text/css" href="개인정보처리방침_style.css"></head><body><div class="hpa" style="width:210mm;height:296.99mm;"><div class="hcD" style="left:30mm;top:35mm;"><div class="hcI"><div class="hls ps20" style="line-height:3.43mm;white-space:nowrap;left:0mm;top:-0.21mm;height:4.23mm;width:150mm;"><span class="hrt cs7">개인정보처리방침</span></div><div class="hls ps0" style="line-height:3.43mm;white-space:nowrap;left:0mm;top:6.56mm;height:4.23mm;width:150mm;"></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:13.37mm;height:3.53mm;width:150mm;"><span class="hrt cs0">제1조(목적)</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:19.01mm;height:3.53mm;width:150mm;"><span class="hrt cs0">EmoTune 다이어리 개발자는 회사가 제공하고자 하는 서비스를 이용하는 개인의 정보를 보</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:24.66mm;height:3.53mm;width:150mm;"><span class="hrt cs0">호하기 위해, 개인정보보호법, 정보통신망 이용촉진 및 정보보호 등에 관한 법률 등 관련 법</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:30.30mm;height:3.53mm;width:150mm;"><span class="hrt cs0">령을 준수하고, 서비스 이용자의 개인정보 보호와 관련한 고충을 신속하고 원활하게 처리할&nbsp;</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:35.95mm;height:3.53mm;width:150mm;"><span class="hrt cs0">수 있도록 하기 위하여 다음과 같이 개인 정보처리방침을 수립합니다.</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:41.59mm;height:3.53mm;width:150mm;"></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:47.24mm;height:3.53mm;width:150mm;"><span class="hrt cs0">제2조(개인정보 처리의 원칙)</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:52.88mm;height:3.53mm;width:150mm;"><span class="hrt cs0">EmoTune 다이어리 앱은 어떠한 개인정보도 수집하지 않습니다.</span></div><div class="hls ps0" style="line-height:2.79mm;white-space:nowrap;left:0mm;top:58.53mm;height:3.53mm;width:150mm;"></div></div></div></div><script>
            function adjustLetterSpacing() {
                const textElements = document.querySelectorAll('.hrt');
        
                textElements.forEach(element => {
                    const container = element.closest('.hls');
                    containerWidth = container.clientWidth;
        
                    const computedStyle = window.getComputedStyle(container);
                    const paddingLeft = parseFloat(computedStyle.paddingLeft) || 0;
                    const paddingRight = parseFloat(computedStyle.paddingRight) || 0;
                    containerWidth -= paddingLeft + paddingRight;
                    
                    const allTextElements = container.querySelectorAll('.hrt');
                    let totalTextWidth = 0;
                    allTextElements.forEach(textElement => {
                        totalTextWidth += textElement.scrollWidth;
                    });
        
                    if (totalTextWidth > containerWidth) {
                        let letterSpacing = parseFloat(window.getComputedStyle(element, null).getPropertyValue('letter-spacing'));
                        if (isNaN(letterSpacing)) {
                            letterSpacing = 0;
                        }
        
                        let newLetterSpacing = letterSpacing;
                        while (totalTextWidth > containerWidth && newLetterSpacing <= 0) {
                            newLetterSpacing -= 0.1;
                            totalTextWidth = paddingLeft + paddingRight;
        
                            allTextElements.forEach(textElement => {
                                textElement.style.letterSpacing = newLetterSpacing + 'px';
                                totalTextWidth += textElement.scrollWidth;
                            });
                        }
        
                        allTextElements.forEach(textElement => {
                            textElement.style.letterSpacing = newLetterSpacing + 'px';
                        });
                    }
                });
            }
            adjustLetterSpacing();
        </script></body></html>
